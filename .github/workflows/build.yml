# Builds the Android app on every push and pull request; every push to main is also published
# as a GitHub Release that installed copies pick up as an in-app update (lib/app/updater.dart).
# (The iPhone app is the native one in its own repository.)
#
# Each release carries BondTouchBeyond.apk, the .aab and update.json (version, version code =
# this workflow's run number, APK link). Stable links to the newest build:
#   https://github.com/<owner>/<repo>/releases/latest/download/BondTouchBeyond.apk
#   https://github.com/<owner>/<repo>/releases/latest/download/update.json
#
# Signing: the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS /
# ANDROID_KEY_PASSWORD secrets (the upload key shared with the other apps; Dev_deploy_setup's
# "Set up app repo" copies them here). Without them builds use a throwaway debug key, and an
# update then needs an uninstall first.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a run on main midway: it may be publishing a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # The upload key shared with the other apps (MagicTrek & co.): the ANDROID_KEYSTORE_*
      # secrets, or the same without the ANDROID_ prefix. Every release must be signed with the
      # same key, or the in-app updater can't install it over the previous build.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "SIGNED=debug" >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_* secrets: signed with a throwaway debug key, so installed copies can't update to this build in place."
            exit 0
          fi
          store="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$store"
          alias="$KEY_ALIAS"
          if [ -z "$alias" ]; then
            alias=$(keytool -list -keystore "$store" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | sed -nE 's/^([^,]+),.*PrivateKeyEntry.*/\1/p' | head -1)
          fi
          echo "::add-mask::$KEYSTORE_PASSWORD"
          {
            echo "ANDROID_KEYSTORE_PATH=$store"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$alias"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "SIGNED=release"
          } >> "$GITHUB_ENV"
          echo "Signing with the release key (alias $alias)"

      - name: Build APK and App Bundle
        run: |
          args="--release --build-number $GITHUB_RUN_NUMBER"
          flutter build apk $args
          flutter build appbundle $args
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/BondTouchBeyond.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/BondTouchBeyond.aab

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.run_number }}
          path: dist/

      # Every release carries update.json (version, version code = this run's number, APK
      # link); installed copies read the one behind releases/latest/download/update.json on
      # launch and offer the new build (lib/app/updater.dart).
      - name: Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -nE 's/^version: ([0-9.]+)\+.*/\1/p' pubspec.yaml)
          TAG="build-$GITHUB_RUN_NUMBER"
          SUBJECT=$(git log -1 --format=%s)
          python3 - "$VERSION" "$GITHUB_RUN_NUMBER" "$TAG" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BondTouchBeyond.apk" "$SUBJECT" "$SIGNED" <<'PY'
          import json, sys
          name, code, tag, apk, notes, signed = sys.argv[1:7]
          json.dump({"versionName": name, "versionCode": int(code), "tag": tag, "apk": apk,
                     "notes": notes, "signing": signed}, open("dist/update.json", "w"), indent=2)
          PY
          {
            echo "Bond Touch Beyond $VERSION (build $GITHUB_RUN_NUMBER) for Android, from \`${GITHUB_SHA::7}\`: $SUBJECT"
            echo
            echo "- **Install**: download \`BondTouchBeyond.apk\` on the phone and open it."
            echo "- **Always the newest build**: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/BondTouchBeyond.apk"
            echo "- Installed copies offer this build as an update when opened."
            if [ "$SIGNED" = debug ]; then
              echo "- Signed with a throwaway debug key: uninstall the previous build first."
            fi
          } > dist/notes.md
          gh release create "$TAG" dist/BondTouchBeyond.apk dist/BondTouchBeyond.aab dist/update.json \
            --title "Bond Touch Beyond $VERSION (build $GITHUB_RUN_NUMBER)" --notes-file dist/notes.md --latest

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
