# Builds the Android app on every push and pull request. (The iPhone app is the native one
# in its own repository; this Flutter project is built for Android only.) Everything it
# needs comes from this repository's own secrets and variables (Settings → Secrets and
# variables → Actions); nothing outside the repo. Every secret is optional: without them the
# apps still build (debug-signed, no Firebase), so a fork builds out of the box.
#
# Secrets
#   GOOGLE_SERVICES_JSON        Firebase Android config (google-services.json), raw or base64
#   ANDROID_KEYSTORE_BASE64     Android upload key (PKCS12 keystore), base64
#   ANDROID_KEYSTORE_PASSWORD   its password
#   ANDROID_KEY_ALIAS           its key alias (default "upload")
#   ANDROID_KEY_PASSWORD        the key's password (default: the keystore password)
#
# Outputs: the Android APK + AAB as run artifacts; on main, a GitHub
# Release with the APK (…/releases/latest/download/BondTouchBeyond.apk).
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Firebase config
        env:
          CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$CONFIG" ]; then
            echo "::warning::No GOOGLE_SERVICES_JSON secret: the app builds, but can't reach partners."
            echo '{}' > firebase.env.json; exit 0
          fi
          if printf '%s' "$CONFIG" | grep -q '"project_info"'; then printf '%s' "$CONFIG" > "$RUNNER_TEMP/gs.json"
          else printf '%s' "$CONFIG" | base64 -d > "$RUNNER_TEMP/gs.json"; fi
          python3 scripts/firebase_defines.py --android "$RUNNER_TEMP/gs.json" > firebase.env.json
          rm -f "$RUNNER_TEMP/gs.json"

      - name: Signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.p12
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a debug key."
          fi

      - name: Build APK and App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          args="--release --build-number $GITHUB_RUN_NUMBER --dart-define-from-file=firebase.env.json"
          flutter build apk $args
          flutter build appbundle $args
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/BondTouchBeyond.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/BondTouchBeyond.aab

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.run_number }}
          path: dist/

      - name: Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -nE 's/^version: ([0-9.]+)\+.*/\1/p' pubspec.yaml)
          gh release create "build-$GITHUB_RUN_NUMBER" dist/BondTouchBeyond.apk dist/BondTouchBeyond.aab \
            --title "Bond Touch Beyond $VERSION ($GITHUB_RUN_NUMBER)" \
            --notes "Build $GITHUB_RUN_NUMBER from ${GITHUB_SHA::7}. On Android, install BondTouchBeyond.apk." --latest

      - name: Clean up
        if: always()
        run: rm -f android/upload-keystore.p12 firebase.env.json
